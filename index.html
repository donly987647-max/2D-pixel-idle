document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();persist()}else{const r=hiddenAt?offlineReward((Date.now()-hiddenAt)/1000):null;hiddenAt=0;last=performance.now();showOffline(r)}});window.addEventListener('pagehide',persist);
function loop(now){const realDt=Math.min(.06,(now-last)/1000);last=now;wallTime+=realDt;if(!document.hidden){if(!paused){let dt=realDt*state.speed;while(dt>0){const step=Math.min(.025,dt);tick(step);dt-=step}}bannerClock-=realDt;if(bannerClock<=0)$('banner').classList.remove('show');uiClock+=realDt;saveClock+=realDt;renderClock+=realDt;if(uiClock>.18){updateUI();uiClock=0}if(saveClock>5){persist();saveClock=0}if(renderClock>=1/40){render();renderClock=0}frame++}requestAnimationFrame(loop)}
const away=(Date.now()-state.savedAt)/1000;syncFighters();startWave(state.stage);updateUI();const reward=offlineReward(away);persist();setTimeout(()=>showOffline(reward),200);requestAnimationFrame(loop);
// Deterministic QA hooks are opt-in and are never enabled during a normal visit.
if(new URLSearchParams(location.search).get('test')==='1')window.__game={get state(){return structuredClone(state)},get battle(){return{phase,stage:state.stage,heart,enemies:enemies.length,spawned,defeated,waveCount,fighters:fighters.map(f=>({type:f.u.type,hp:f.hp,revive:f.revive,x:f.x,atk:f.st.atk})),spellCD}},step(seconds){for(let t=0;t<seconds;t+=.025)tick(.025);updateUI()},setResources(gold,shards){state.gold=gold;state.shards=shards;dirty=true;updateUI()},setBest(n){state.best=n;dirty=true;updateUI()},showUnit,showItems,cast,save:persist,offline:offlineReward,validate:validSave,startWave,pause(v=true){paused=v},damageHeart(){heart=0;lose()}};
})();
