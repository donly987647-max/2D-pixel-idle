name: Verify Orbit Foundry
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game and progression
        run: node tests/smoke.cjs
      - name: Package playable HTML
        uses: actions/upload-artifact@v4
        with:
          name: orbit-foundry-v0.1.0
          path: index.html
          retention-days: 30
