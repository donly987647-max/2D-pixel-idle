name: Prototype QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightkeep-prototype-qa
          path: |
            index.html
            tests/smoke.cjs
            qa/
          retention-days: 14
